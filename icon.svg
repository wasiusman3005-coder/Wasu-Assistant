<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1a0b2e" />
      <stop offset="50%" stop-color="#090514" />
      <stop offset="100%" stop-color="#040208" />
    </radialGradient>

    <!-- Cyber Rose to Cyan Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#b5179e" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00f5d4" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

  <!-- Outer Cyber Hex Ring & Circuit Tracks -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00f5d4" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ff2a85" stroke-width="3" stroke-opacity="0.35" stroke-dasharray="16 10 4 10" />

  <!-- Crosshair Radar Ticks -->
  <line x1="256" y1="36" x2="256" y2="58" stroke="#00f5d4" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="454" x2="256" y2="476" stroke="#00f5d4" stroke-width="3" stroke-linecap="round" />
  <line x1="36" y1="256" x2="58" y2="256" stroke="#ff2a85" stroke-width="3" stroke-linecap="round" />
  <line x1="454" y1="256" x2="476" y2="256" stroke="#ff2a85" stroke-width="3" stroke-linecap="round" />

  <!-- Quantum Orbital Ellipses -->
  <ellipse cx="256" cy="256" rx="175" ry="70" fill="none" stroke="#00f5d4" stroke-width="2.5" stroke-opacity="0.6" transform="rotate(-30 256 256)" filter="url(#dropShadow)" />
  <ellipse cx="256" cy="256" rx="175" ry="70" fill="none" stroke="#ff2a85" stroke-width="2.5" stroke-opacity="0.6" transform="rotate(30 256 256)" filter="url(#dropShadow)" />

  <!-- Orbital Particles -->
  <circle cx="110" cy="180" r="4.5" fill="#00f5d4" filter="url(#neonGlow)" />
  <circle cx="402" cy="332" r="4.5" fill="#00f5d4" filter="url(#neonGlow)" />
  <circle cx="390" cy="180" r="4.5" fill="#ff2a85" filter="url(#neonGlow)" />
  <circle cx="122" cy="332" r="4.5" fill="#ff2a85" filter="url(#neonGlow)" />

  <!-- Central Holographic Heart Core -->
  <g filter="url(#neonGlow)">
    <path
      d="M256,380 C246,370 120,270 120,185 C120,135 160,98 210,98 C236,98 250,112 256,122 C262,112 276,98 302,98 C352,98 392,135 392,185 C392,270 266,370 256,380 Z"
      fill="url(#cyberGrad)"
      fill-opacity="0.88"
    />
  </g>

  <!-- Glowing Wireframe Inner Heart Contour -->
  <path
    d="M256,358 C248,350 144,264 144,192 C144,152 176,122 214,122 C236,122 248,134 256,144 C264,134 276,122 298,122 C336,122 368,152 368,192 C368,264 264,350 256,358 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    stroke-opacity="0.75"
  />

  <!-- High-Tech Core Pulse Ring -->
  <circle cx="256" cy="220" r="32" fill="#08070d" fill-opacity="0.6" stroke="#00f5d4" stroke-width="2" />
  <polygon points="256,200 273,212 273,228 256,240 239,228 239,212" fill="none" stroke="#ff2a85" stroke-width="2" />
  <circle cx="256" cy="220" r="6" fill="#00f5d4" filter="url(#neonGlow)" />

  <!-- Typography Brand Banner -->
  <text
    x="256"
    y="430"
    text-anchor="middle"
    fill="#ffffff"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="28"
    font-weight="900"
    letter-spacing="5"
    filter="url(#neonGlow)"
  >
    WASU LOVE
  </text>
  <text
    x="256"
    y="450"
    text-anchor="middle"
    fill="#00f5d4"
    font-family="monospace"
    font-size="12"
    font-weight="600"
    letter-spacing="3"
  >
    CYBER JARVIS OS
  </text>
</svg>
