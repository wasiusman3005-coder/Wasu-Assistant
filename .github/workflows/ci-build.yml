name: Q-NEXUS Quantum Jarvis CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm install

      - name: TypeScript Lint Check
        run: npm run lint

      - name: Vite 4K UHD Production Build
        run: npm run build

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python Desktop Scripts Syntax
        run: python -m py_compile jarvis_desktop.py build_pc_app.py
