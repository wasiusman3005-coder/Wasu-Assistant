    <script>
      (function() {
        if (typeof window === 'undefined') return;

        // 1. Intercept window.WebSocket for Vite HMR in iframe preview environments
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              urlStr.indexOf('vite-hmr') !== -1;

            if (isViteHmr) {
              var listeners = {};
              var mockSocket = {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                readyState: 1, // OPEN
                url: urlStr,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                close: function(code, reason) {
                  mockSocket.readyState = 3;
                  var closeEvt = { wasClean: true, code: code || 1000, reason: reason || '', type: 'close' };
                  if (typeof mockSocket.onclose === 'function') mockSocket.onclose(closeEvt);
                  (listeners['close'] || []).forEach(function(fn) { fn(closeEvt); });
                },
                send: function() {},
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
                  }
                },
                dispatchEvent: function(evt) {
                  var list = listeners[evt.type] || [];
                  list.forEach(function(fn) { fn(evt); });
                  return true;
                }
              };

              // Trigger open cleanly after current microtask
              setTimeout(function() {
                if (mockSocket.readyState === 1) {
                  var openEvt = { type: 'open' };
                  if (typeof mockSocket.onopen === 'function') mockSocket.onopen(openEvt);
                  (listeners['open'] || []).forEach(function(fn) { fn(openEvt); });
                }
              }, 0);

              return mockSocket;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Intercept console.error to filter out Vite HMR WebSocket disconnect noise
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function(a) {
            return (a && a.message) ? a.message : String(a || '');
          }).join(' ');

          if (
            text.indexOf('WebSocket closed without opened') !== -1 ||
            text.indexOf('@vite/client') !== -1 ||
            (text.indexOf('[vite]') !== -1 && text.indexOf('WebSocket') !== -1)
          ) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        // 3. Catch window errors & unhandled rejections
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          var file = (e && e.filename) || '';
          if (
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            file.indexOf('@vite/client') !== -1 ||
            msg.indexOf('WebSocket') !== -1
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && (e.reason && (e.reason.message || e.reason))) || '';
          if (String(reason).indexOf('WebSocket') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
