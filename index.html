    <script>
      // Suppress harmless Vite HMR WebSocket connection errors in sandbox iframe environment
      window.addEventListener('error', function(e) {
        if (
          e?.message?.includes('WebSocket closed without opened') ||
          e?.filename?.includes('@vite/client') ||
          (e?.error?.message && e.error.message.includes('WebSocket'))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (
          (typeof e?.reason === 'string' && e.reason.includes('WebSocket')) ||
          (e?.reason?.message && e.reason.message.includes('WebSocket'))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
